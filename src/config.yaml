# User-editable configuration for the dashboard.
# Values here are baked into the page at build time; no secrets belong in this file.

location:
  city: "Carrollton, GA"
  lat: 33.5801
  lon: -85.0766
  timezone: "America/New_York"

sports:
  # ESPN team IDs. Look up via espn.com team URL: …/team/_/id/<teamId>/…
  teams:
    - { league: "mlb",              team_id: 15, label: "Braves" }
    - { league: "nfl",              team_id: 1,  label: "Falcons" }
    - { league: "college-football", team_id: 61, label: "Bulldogs" }

news:
  hn_count: 5            # how many top HN stories to fetch
  per_source_max: 2      # cap items per individual feed/source
  total_max: 10          # final cap after merge
  rss:
    - "https://www.anthropic.com/rss.xml"
  reddit_subs:
    - "AtlantaBraves"
    - "falcons"
    - "georgiabulldogs"
  google_news_queries:
    - "Atlanta Falcons"
    - "Atlanta Braves"
    - "Georgia Bulldogs football"
